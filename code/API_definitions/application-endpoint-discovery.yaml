externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/ApplicationEndpointDiscovery
servers:
  - url: "{apiRoot}/application-endpoint-discovery/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`

tags:
  - name: Application Endpoint Discovery
    description: |
      Find the optimal Application Instance Endpoint(s) to the user device.
paths:
  /retrieve-optimal-app-endpoints:
    post:
      security:
        - openId:
            - application-endpoint-discovery:app-endpoints:read
      operationId: getOptimalAppEndpoints
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointDiscoveryInfo"
            examples:
              Identify Device By 3-Legged Access Token and AppId:
                $ref: '#/components/examples/IdentifyDeviceBy3LeggedTokenAppId'
              Identify Device By Phone Number and AppId:
                $ref: '#/components/examples/IdentifyDeviceByPhoneNumberAppId'
              Identify Device By IP Address and ApplicationEndpointsId:
                $ref: '#/components/examples/IdentifyDeviceByIPAddressAppEndpointsId'
              Identify Device By Multiple Identifiers and AppId:
                $ref: '#/components/examples/IdentifyDeviceByMultipleIdentifiersAppId'
      responses:
        "200":
          description: |
           Successful response, returning the optimal Application Instance
           Endpoint(s) to the user device identified in the request body.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointDiscoveryResult"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "422":
          $ref: "#/components/responses/Generic422"
        "429":
          $ref: "#/components/responses/Generic429"
      tags:
        - Application Endpoint Discovery
      summary: |
        Returns the Endpoint(s) of the optimal Application Instance(s) to the user
        device identified in the request.
      description: |
        On receiving this request, the network will return the endpoint(s)
        of the Application Instance(s) with the shortest network path to the
        end user device identified in the request.
components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
  headers:
    x-correlator:
      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
  parameters:
    x-correlator:
      $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
  schemas:
    EndpointDiscoveryInfo:
      description: |
        Element to retrieve the optimal application endpoint(s) for the
        identified device. At least one of `appId` or `applicationEndpointsId`
        MUST be provided. Both MAY be provided together; when they are, the
        server validates that the `applicationEndpointsId` is associated with
        the application identified by `appId`.
      type: object
      anyOf:
        - required: [applicationEndpointsId]
        - required: [appId]
      properties:
        device:
          description: |
            End-user equipment able to connect to a mobile network.
            See the "Identifying the device from the access token" section
            in the API description for rules on when this field MUST or
            MUST NOT be provided.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        applicationEndpointsId:
          $ref: "#/components/schemas/ApplicationEndpointsId"
        appId:
          $ref: "#/components/schemas/AppId"

    ApplicationEndpointsId:
      description: |
        A system-defined string identifier representing
        one or more registered Application Endpoints that belong
        to the same application.
      type: string
      format: uuid
      maxLength: 36
      example: "4d596ac1-7822-4927-a3c5-d72e1f922c94"

    AppId:
      type: string
      format: uuid
      maxLength: 36
      description: |
        A globally unique identifier associated with the application.
        This GUID will have been previously provided by the Edge Cloud Zone
        provider.
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    EndpointDiscoveryResult:
      description: |
        Endpoint Discovery result including optimal application endpoint(s)
        for the requested identified device.
      type: object
      required:
        - applicationEndpoints
      anyOf:
        - required: [applicationEndpointsId]
        - required: [appId]
      properties:
        applicationEndpoints:
          description: |
            Array of optimal Application Endpoints for the identified device.
            When multiple endpoints are returned, they are ordered by optimality
            in descending order: the first entry is the most optimal endpoint
            (shortest network path from the identified device). All returned
            endpoints represent currently available application instances.
          type: array
          maxItems: 50
          minItems: 1
          items:
            $ref: "#/components/schemas/ApplicationEndpoint"
        appId:
          $ref: "#/components/schemas/AppId"
        applicationEndpointsId:
          $ref: "#/components/schemas/ApplicationEndpointsId"
        applicationServerProviderName:
          type: string
          maxLength: 256
          pattern: ^[^\r\n]*$
          description: |
            Unique ID representing the Edge Application Provider.
            If absent, the API provider does not expose the Application Provider
            identifier for this response.
        applicationProfileId:
          description: |
            A unique identifier for the application profile associated with
            the returned endpoints. If absent, no Application Profile is
            associated with the returned endpoints.
          allOf:
            - $ref: "#/components/schemas/ApplicationProfileId"
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceResponse"

    EdgeCloudZone:
      type: object
      description: |
        An Edge Cloud Zone, uniquely identified by a
        combination of the value of the Edge Cloud Zone Id object
        and the value of the Edge Cloud Provider
        object. This value is used to identify an Edge Cloud zone
        between Edge Clouds from different Edge Cloud Providers.
      required:
        - edgeCloudZoneId
        - edgeCloudZoneName
        - edgeCloudProvider
        - edgeCloudZoneStatus
      properties:
        edgeCloudZoneId:
          $ref: "#/components/schemas/EdgeCloudZoneId"
        edgeCloudZoneName:
          $ref: "#/components/schemas/EdgeCloudZoneName"
        edgeCloudZoneStatus:
          $ref: "#/components/schemas/EdgeCloudZoneStatus"
        edgeCloudProvider:
          $ref: "#/components/schemas/EdgeCloudProvider"
        edgeCloudRegion:
          $ref: "#/components/schemas/EdgeCloudRegion"

    EdgeCloudZoneId:
      description: A unique identifier for the Edge Cloud Zone.
      type: string
      format: uuid
      maxLength: 36
      example: "123e4567-e89b-12d3-a456-426614174000"

    EdgeCloudRegion:
      description: |
        The EdgeCloudProvider's name for the region where the Edge Cloud
        Zone is located. If absent, the Edge Cloud Zone is not associated
        with a named region by this provider.
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9]([A-Za-z0-9-]{0,53}[A-Za-z0-9])?$
      example: "us-west-1"

    EdgeCloudZoneStatus:
      description: Status of the Edge Cloud Zone.
      type: string
      enum:
        - active
        - inactive
        - unknown

    EdgeCloudProvider:
      description: The provider of the Edge Cloud.
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9]([A-Za-z0-9-]{0,53}[A-Za-z0-9])?$
      example: "ProviderA"

    EdgeCloudZoneName:
      description: The name of the Edge Cloud Zone.
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9]([A-Za-z0-9-]{0,53}[A-Za-z0-9])?$
      example: "ZoneA"

    ApplicationProfileId:
      description: A unique identifier for the application profile.
      type: string
      format: uuid
      maxLength: 36
      example: "123e4567-e89b-12d3-a456-426614174000"

    ApplicationEndpoint:
      type: object
      description: |
        An application server IP address or FQDN with a port,
        exposed by an application instance deployed on the Edge Cloud
        provider.
      required:
        - port
      anyOf:
        - required: [fqdn]
        - required: [ipv4Addresses]
        - required: [ipv6Addresses]
      properties:
        fqdn:
          $ref: "#/components/schemas/Fqdn"
        ipv4Addresses:
          description: Array of IPv4 addresses exposed by the application instance.
          type: array
          maxItems: 1
          minItems: 1
          items:
            $ref: "#/components/schemas/Ipv4Address"
        ipv6Addresses:
          description: Array of IPv6 addresses exposed by the application instance.
          type: array
          maxItems: 1
          minItems: 1
          items:
            $ref: "#/components/schemas/Ipv6Address"
        port:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Port"
        edgeCloudZone:
          description: |
            Identifies the Edge Cloud Zone where this application endpoint is
            deployed. If absent, the API provider does not expose Edge Cloud
            Zone information for this endpoint.
          allOf:
            - $ref: "#/components/schemas/EdgeCloudZone"
        applicationEndpointDescription:
          type: string
          maxLength: 2048
          pattern: ^[^\r\n]*$
          description: |
            Description of the application endpoint.
            If absent, no description is available for this endpoint.

    Fqdn:
      type: string
      maxLength: 253
      pattern: ^[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?)+$
      description: Fully Qualified Domain Name.

    Ipv4Address:
      type: string
      format: ipv4
      maxLength: 15
      description: |
        A single IPv4 address specified in dotted-quad form like 1.2.3.4.
      example: "198.51.100.1"

    Ipv6Address:
      type: string
      format: ipv6
      maxLength: 45
      description: |
        A single IPv6 address, following IETF 5952 format like
        2001:db8:85a3:8d3:1319:8a2e:370:7344.
      example: "2001:db8:85a3::8a2e:370:7334"

  responses:
    Generic400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              description: Invalid Argument. Generic Syntax Exception
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: "Client specified an invalid argument, request body or query param."
            GENERIC_400_MISSING_APP_IDENTIFIER:
              description: Neither appId nor applicationEndpointsId is provided. Exactly one must be present.
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: "One of appId or applicationEndpointsId must be provided."
    Generic401:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic401"
    Generic403:
      description: Forbidden
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
          examples:
            GENERIC_403_PERMISSION_DENIED:
              description: Permission denied. OAuth2 token access does not have the required scope or when the user fails operational security
              value:
                status: 403
                code: PERMISSION_DENIED
                message: "Client does not have sufficient permissions to perform this action."
    Generic404:
      description: Not Found
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - NOT_FOUND
                      - IDENTIFIER_NOT_FOUND
          examples:
            GENERIC_404_NOT_FOUND_APP_ID:
              description: The provided appId does not identify a valid application on the Edge Cloud
              value:
                status: 404
                code: NOT_FOUND
                message: "No application found for the provided appId."
            GENERIC_404_NOT_FOUND_APP_ENDPOINTS_ID:
              description: The provided applicationEndpointsId does not identify any registered endpoint on the Edge Cloud
              value:
                status: 404
                code: NOT_FOUND
                message: "No registered endpoints found for the provided applicationEndpointsId."
            GENERIC_404_IDENTIFIER_NOT_FOUND:
              description: The device identifier provided in the request cannot be matched to a device on the network
              value:
                status: 404
                code: IDENTIFIER_NOT_FOUND
                message: "Device identifier not found."
    Generic422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - MISSING_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
                      - APPLICATION_ENDPOINT_DISCOVERY.IDENTIFIER_MISMATCH
          examples:
            GENERIC_422_MISSING_IDENTIFIER:
              description: An identifier is not included in the request and the device identification cannot be derived from the access token
              value:
                status: 422
                code: MISSING_IDENTIFIER
                message: "The device cannot be identified."
            GENERIC_422_UNNECESSARY_IDENTIFIER:
              description: An explicit device identifier is provided when the device has already been identified from the access token
              value:
                status: 422
                code: UNNECESSARY_IDENTIFIER
                message: "The device is already identified by the access token."
            APPLICATION_ENDPOINT_DISCOVERY_422_IDENTIFIER_MISMATCH:
              description: Both appId and applicationEndpointsId are provided but the applicationEndpointsId is not associated with the application identified by appId
              value:
                status: 422
                code: APPLICATION_ENDPOINT_DISCOVERY.IDENTIFIER_MISMATCH
                message: "The provided applicationEndpointsId is not associated with the provided appId."
    Generic429:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic429"

  examples:
    IdentifyDeviceBy3LeggedTokenAppId:
      description: Empty JSON when device is identified by access token
      value:
        appId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    IdentifyDeviceByPhoneNumberAppId:
      description: Identifying device by phone number
      value:
        device:
          phoneNumber: "+123456789"
        appId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    IdentifyDeviceByIPAddressAppEndpointsId:
      description: Identifying device by IP address
      value:
        device:
          ipv4Address:
            publicAddress: "84.125.93.10"
            publicPort: 59765
        applicationEndpointsId: "4d596ac1-7822-4927-a3c5-d72e1f922c94"

    IdentifyDeviceByMultipleIdentifiersAppId:
      description: Identifying device by multiple device identifiers
      value:
        device:
          phoneNumber: "+123456789"
          ipv4Address:
            publicAddress: "84.125.93.10"
            publicPort: 59765
          networkAccessIdentifier: "123456789@domain.com"
        appId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
